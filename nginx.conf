server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/api/auth/(.*\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/database/auth/$1;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ ^/api/products/(.*\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/database/products/$1;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\. {
        deny all;
    }
}
