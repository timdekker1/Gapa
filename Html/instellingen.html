<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instellingen | Gapa Lederwaren</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: #111; background: #f7f7f5; }
        header { min-height: 80px; padding: 0 6%; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #e5e5e5; }
        header img { width: 150px; height: auto; display: block; }
        nav { display: flex; gap: 30px; align-items: center; }
        nav a { color: inherit; font-size: 14px; font-weight: bold; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { width: 90%; max-width: 620px; margin: 80px auto; }
        section { padding: 42px; background: #fff; border: 1px solid #e2e2e2; }
        .eyebrow { color: #777; font-size: 11px; font-weight: bold; letter-spacing: 3px; }
        h1 { margin: 12px 0; font-size: 42px; }
        p { color: #666; line-height: 1.6; }
        .account-email { margin: 28px 0; padding: 16px; background: #f3f3f1; font-weight: bold; }
        button { padding: 13px 20px; border: 0; background: #111; color: #fff; cursor: pointer; font-weight: bold; }
        .message { min-height: 22px; margin-top: 18px; color: #a00000; }
        @media (max-width: 600px) { header { flex-direction: column; gap: 18px; padding: 20px 5%; } nav { gap: 16px; flex-wrap: wrap; justify-content: center; } main { margin: 45px auto; } section { padding: 28px; } h1 { font-size: 34px; } }
    </style>
</head>
<body>
    <header>
        <a href="../index.html"><img src="../gapalederwaren.jpg" alt="Gapa Lederwaren"></a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="collectie.html">Collectie</a>
            <a href="matcher.html">Matcher</a>
            <a href="instellingen.html">Instellingen</a>
        </nav>
    </header>
    <main>
        <section>
            <div class="eyebrow">GAPA LEDERWAREN · ACCOUNT</div>
            <h1>Instellingen</h1>
            <p>Bekijk je accountgegevens of meld je veilig af.</p>
            <div class="account-email" id="accountEmail">Account controleren...</div>
            <button id="logoutButton" type="button">Uitloggen</button>
            <div class="message" id="message" role="status"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL  = "https://gpjaxsppsggzlmdsnxvy.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwamF4c3Bwc2dnemxtZHNueHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzkwMzgsImV4cCI6MjEwNTIxNTAzOH0.ZpSxSYPyAP6eUPgVdLK-MBmeDBbLD7JM9qk-32ow-cY";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        /* Alleen toegankelijk als ingelogd */
        sb.auth.getSession().then(({ data }) => {
            if (!data.session) {
                window.location.replace("login.html");
                return;
            }
            const user = data.session.user;
            document.getElementById('accountEmail').textContent = user.email;
        });

        document.getElementById('logoutButton').addEventListener('click', async function () {
            this.disabled = true;
            this.textContent = 'Uitloggen...';
            await sb.auth.signOut();
            window.location.replace("login.html");
        });
    </script>
</body>
</html>
