<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Productinformatie van Gapa Lederwaren.">
    <title>Product | Gapa Lederwaren</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #171717; background: #fff; font-family: Arial, Helvetica, sans-serif; }
        a { color: inherit; }
        .site-header { min-height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 max(24px, calc((100vw - 1240px) / 2)); border-bottom: 1px solid #e4e4e4; }
        .brand { font-size: 21px; font-weight: 900; letter-spacing: 2px; text-decoration: none; }
        .back-link { font-size: 13px; font-weight: bold; text-decoration-thickness: 1px; text-underline-offset: 4px; }
        main { width: min(1240px, calc(100% - 48px)); margin: 28px auto 72px; }
        .breadcrumb { margin: 0 0 20px; color: #777; font-size: 12px; }
        .product-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, .9fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
        .product-photo-wrap { background: #f1f1ef; aspect-ratio: 4 / 5; max-height: 780px; }
        .product-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
        .product-info { padding: 18px 0; }
        .product-category { margin: 0 0 10px; color: #666; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        h1 { margin: 0; font-size: 36px; line-height: 1.12; }
        .product-price { margin: 20px 0 8px; font-size: 24px; font-weight: bold; }
        .product-stock { margin: 0 0 26px; font-size: 13px; font-weight: bold; }
        .product-description { margin: 0; color: #444; font-size: 15px; line-height: 1.7; white-space: pre-line; }
        .question-section { margin-top: 34px; padding-top: 24px; border-top: 1px solid #dcdcdc; }
        .question-section h2 { margin: 0 0 15px; font-size: 20px; }
        .question-item { padding: 14px 0; border-bottom: 1px solid #eee; font-size: 13px; line-height: 1.6; }
        .question-item strong { display: block; margin-bottom: 4px; }
        .question-form { display: grid; gap: 12px; margin-top: 20px; }
        .question-form label { display: grid; gap: 6px; font-size: 12px; font-weight: bold; }
        .question-form input, .question-form textarea { width: 100%; border: 1px solid #cfcfcf; border-radius: 0; padding: 11px 12px; font: inherit; font-size: 14px; }
        .question-form textarea { min-height: 96px; resize: vertical; }
        .question-form button { justify-self: start; border: 0; background: #111; color: white; padding: 12px 18px; font: inherit; font-size: 13px; font-weight: bold; cursor: pointer; }
        .question-form button:disabled { opacity: .55; cursor: wait; }
        .form-status { min-height: 18px; margin: 0; font-size: 12px; }
        .page-state { padding: 72px 0; color: #555; text-align: center; }
        footer { padding: 22px 24px; border-top: 1px solid #e4e4e4; color: #666; font-size: 12px; text-align: center; }
        @media (max-width: 760px) {
            .site-header { min-height: 64px; padding: 0 18px; }
            main { width: calc(100% - 36px); margin-top: 18px; }
            .product-layout { grid-template-columns: 1fr; gap: 12px; }
            .product-photo-wrap { aspect-ratio: 4 / 4.2; }
            .product-info { padding-top: 12px; }
            h1 { font-size: 30px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../index.html">GAPA</a>
        <a class="back-link" href="collectie.html">Terug naar collectie</a>
    </header>
    <main>
        <p class="breadcrumb"><a href="collectie.html">Collectie</a> / Product</p>
        <div id="pageState" class="page-state">Product laden...</div>
        <section id="productContent" class="product-layout" hidden>
            <div class="product-photo-wrap"><img id="productImage" class="product-photo" alt=""></div>
            <div class="product-info">
                <p id="productCategory" class="product-category"></p>
                <h1 id="productName"></h1>
                <p id="productPrice" class="product-price"></p>
                <p id="productStock" class="product-stock"></p>
                <p id="productDescription" class="product-description"></p>
                <section class="question-section" aria-labelledby="questionsTitle">
                    <h2 id="questionsTitle">Vragen over dit product</h2>
                    <div id="answeredQuestions" aria-live="polite">Vragen laden...</div>
                    <form id="questionForm" class="question-form">
                        <label>Naam<input name="name" autocomplete="name" maxlength="120" required></label>
                        <label>E-mailadres<input name="email" type="email" autocomplete="email" maxlength="255" required></label>
                        <label>Je vraag<textarea name="question" minlength="5" maxlength="4000" required></textarea></label>
                        <p id="questionStatus" class="form-status" role="status" aria-live="polite"></p>
                        <button type="submit">Vraag versturen</button>
                    </form>
                </section>
            </div>
        </section>
    </main>
    <footer>Gapa Lederwaren</footer>
    <script src="product-detail.js"></script>
</body>
</html>
